<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxySMP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/assets/galaxy.png" type="image/x-icon">
</head>
<body>
    <div class="menu">
        <a href="/" class="hover-underline-animation menu-element"><img src="/assets/galaxy-noback.png" style="width: 70px;"></a>
        <a href="/howtojoin.html" class="hover-underline-animation menu-element">Comment rejoindre ?</a>
        <a href="/faq.html" class="hover-underline-animation menu-element">FAQ</a>
        <a href="https://discord.gg/S2wEps9kUZ" target="_blank" class="menu-element">
            <img src="/assets/discord.png" class="logo-menu">

    <div class="container">
        <div class="join-container">
            <img src="/assets/galaxy.png" class="image-galaxy">
            <div class="join-container-side">
                <h1 class="title-galaxy">
                    Rejoins le <span class="galaxysmp-gradient">GalaxySMP</span> dès maintenant !
                </h1>
                <a href="howtojoin.html" class="join-galaxy">Rejoindre l'aventure</a>

            <div class="down-arrow"></div>
        </div>

            <div class="presentation-text-side presentation-left">
                <h1 class="presentation-title">Vole les vies des autres joueurs</h1>
                <div>Avec un système style LifeSteal, vole les cœurs de autres joueurs en les tuant</div>
            </div>
            <img src="/assets/heart.png" class="presentation-image" style="image-rendering: pixelated;">
        </div>
    </div>
    <div class="footer">
        <div class="footer-element">Site fait par Plotesian</div>
        <a href="/legal/mentions-legales.html" class="footer-element hover-underline-animation">Mentions légales</a>
